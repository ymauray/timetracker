name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Version depuis le tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release

      - name: Publier les binaires standalone
        run: |
          set -e
          mkdir -p release-assets
          declare -A targets=(
            [win-x64]=TimeTracker-win-x64.exe
            [linux-x64]=TimeTracker-linux-x64
            [osx-x64]=TimeTracker-osx-x64
            [osx-arm64]=TimeTracker-osx-arm64
          )
          for rid in "${!targets[@]}"; do
            dotnet publish src/TimeTracker -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.version }} \
              -o "publish/$rid"
            src="publish/$rid/TimeTracker"
            [ -f "$src.exe" ] && src="$src.exe"
            cp "$src" "release-assets/${targets[$rid]}"
          done
          ls -la release-assets

      - name: Créer la release GitHub
        run: gh release create "${{ github.ref_name }}" release-assets/* --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
